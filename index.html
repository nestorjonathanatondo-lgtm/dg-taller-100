<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D&G Automotriz</title>
<meta name="theme-color" content="#7b2d2d">
<style>
body{margin:0;background:#eef2f7;font-family:system-ui;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:30px 0}
h1{color:#9aa3b2;font-weight:300;letter-spacing:9px;font-size:16px;margin:20px 0}
.grid{display:grid;gap:28px}
.btn{width:220px;height:220px;border-radius:36px;background:#eef2f7;box-shadow:12px 12px 24px #d1d9e6,-12px -12px 24px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;transition:.15s}
.btn:active{box-shadow:inset 8px 8px 16px #d1d9e6,inset -8px -8px 16px #fff}
.btn img{width:150px;height:150px;object-fit:contain;border-radius:26px}
.btn span{margin-top:14px;color:#6b7280;font-weight:800;letter-spacing:3px;font-size:11px}
</style></head>
<body>
<h1>D & G AUTOMOTRIZ</h1>
<div class="grid">
<a class="btn" href="dg-taller-100/supervisor/"><img src="dg-taller-100/supervisor/icon-512.jpg"><span>SUPERVISOR</span></a>
<a class="btn" href="dg-taller-100/tecnico/"><img src="dg-taller-100/tecnico/icon-512.jpg"><span>TÉCNICO</span></a>
<a class="btn" href="dg-taller-100/cliente/"><img src="dg-taller-100/cliente/icon-512.jpg"><span>CLIENTE</span></a>
</div>
</body></html>
