<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D&G Automotriz</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b2d2d">
<style>
body{margin:0;background:#eef2f7;font-family:system-ui;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:30px 0}
h1{color:#9aa3b2;font-weight:300;letter-spacing:8px;font-size:18px;margin:10px}
.grid{display:grid;grid-template-columns:1fr;gap:30px;margin-top:20px}
.btn{width:210px;height:210px;border-radius:36px;background:#eef2f7;box-shadow:12px 12px 24px #d1d9e6,-12px -12px 24px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;transition:all .15s}
.btn:active{box-shadow:inset 8px 8px 16px #d1d9e6,inset -8px -8px 16px #fff}
.btn img{width:140px;height:140px;object-fit:contain;border-radius:24px}
.btn span{margin-top:12px;color:#6b7280;font-weight:700;letter-spacing:3px;font-size:11px}
</style></head>
<body>
<h1>D & G AUTOMOTRIZ</h1>
<div class="grid">
<a class="btn" href="supervisor/"><img src="https://i.imgur.com/8QJ4sQp.jpeg"><span>SUPERVISOR</span></a>
<a class="btn" href="tecnico/"><img src="https://i.imgur.com/2ZyKzLq.jpeg"><span>TÉCNICO</span></a>
<a class="btn" href="cliente/?codigo=ABC1234"><img src="https://i.imgur.com/4ZyKzLq.jpeg"><span>CLIENTE</span></a>
</div>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
</body></html>
