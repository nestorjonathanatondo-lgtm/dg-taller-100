<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D&G Automotriz</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b2d2d">
<style>
body{
  margin:0;
  background:#eef2f7;
  font-family:system-ui;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  padding:40px 0;
}
h1{
  color:#6b7280;
  font-weight:600;
  letter-spacing:8px;
  font-size:18px;
  margin:10px 0 30px 0;
  /* Sombra suave blanca para darle relieve al título */
  text-shadow:1px 1px 0 #ffffff;
}
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:40px;
  margin-top:20px;
}
.btn{
  width:210px;
  height:210px;
  border-radius:36px;
  background:#eef2f7;
  /* Bordes más definidos y sombras más profundas */
  border:1px solid rgba(255,255,255,0.6);
  box-shadow:12px 12px 24px #c8d0dc,-12px -12px 24px #ffffff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  transition:all 0.3s ease;
}
/* Efecto hover: se eleva y las sombras crecen */
.btn:hover{
  transform:translateY(-5px);
  box-shadow:16px 16px 32px #c8d0dc,-16px -16px 32px #ffffff;
}
/* Efecto al presionar: se hunde (cóncavo) */
.btn:active{
  transform:translateY(2px);
  box-shadow:inset 8px 8px 16px #c8d0dc,inset -8px -8px 16px #ffffff;
}
.btn img{
  width:140px;
  height:140px;
  object-fit:contain;
  border-radius:24px;
  /* Sombra suave para que la imagen se despegue del botón */
  filter:drop-shadow(0px 8px 8px rgba(0,0,0,0.15));
}
.btn span{
  margin-top:15px;
  color:#4b5563;
  font-weight:700;
  letter-spacing:3px;
  font-size:11px;
}
</style></head>
<body>
<h1>D & G AUTOMOTRIZ</h1>
<div class="grid">
<a class="btn" href="supervisor/"><img src="https://i.imgur.com/8QJ4sQp.jpeg"><span>SUPERVISOR</span></a>
<a class="btn" href="tecnico/"><img src="https://i.imgur.com/2ZyKzLq.jpeg"><span>TÉCNICO</span></a>
<a class="btn" href="cliente/?codigo=ABC1234"><img src="https://i.imgur.com/4ZyKzLq.jpeg"><span>CLIENTE</span></a>
</div>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
</body></html>
