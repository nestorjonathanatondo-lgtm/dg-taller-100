<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D&G Automotriz</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b2d2d">
<style>
body{margin:0;background:#eef2f7;font-family:system-ui;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:30px 0}
h1{color:#9aa3b2;font-weight:300;letter-spacing:8px;font-size:18px;margin:10px}
.grid{display:grid;gap:28px;margin-top:20px}
.btn{width:220px;height:220px;border-radius:36px;background:#eef2f7;box-shadow:12px 12px 24px #d1d9e6,-12px -12px 24px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none}
.btn:active{box-shadow:inset 8px 8px 16px #d1d9e6,inset -8px -8px 16px #fff}
.btn img{width:140px;height:140px;object-fit:contain;border-radius:24px;background:#eef2f7}
.btn span{margin-top:14px;color:#6b7280;font-weight:700;letter-spacing:3px;font-size:11px}
</style></head>
<body>
<h1>D & G AUTOMOTRIZ</h1>
<div class="grid">
<a class="btn" href="supervisor/"><img src="supervisor/icon-512.jpg"><span>SUPERVISOR</span></a>
<a class="btn" href="tecnico/"><img src="tecnico/icon-512.jpg"><span>TÉCNICO</span></a>
<a class="btn" href="cliente/"><img src="cliente/icon-512.jpg"><span>CLIENTE</span></a>
</div>
</body></html>
